<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>TODO</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="src/todo-core.js" defer></script>
  <script src="src/app.js" defer></script>
</head>
<body>
  <main class="app">
    <h1>TODO</h1>

    <p id="storage-warning" class="notice" role="alert" hidden>
      このブラウザではデータを保存できません。ページを閉じると内容が失われます。
    </p>

    <div class="card">
      <form id="new-todo-form" class="new-todo">
        <label for="new-todo" class="visually-hidden">新しいタスク</label>
        <input id="new-todo" type="text" placeholder="やることを入力…" autocomplete="off" maxlength="200" autofocus>
        <button type="submit">追加</button>
      </form>

      <p id="empty" class="empty">タスクはまだありません。</p>

      <section id="main" aria-label="タスク一覧" hidden>
        <div class="toolbar">
          <input id="toggle-all" type="checkbox">
          <label id="toggle-all-label" for="toggle-all">すべて完了にする</label>
        </div>
        <ul id="todo-list" class="todo-list"></ul>
        <p id="filter-empty" class="empty" hidden></p>
      </section>

      <footer id="footer" class="footer" hidden>
        <span id="count"></span>
        <nav aria-label="表示の切り替え">
          <ul class="filters">
            <li><a href="#/">すべて</a></li>
            <li><a href="#/active">未完了</a></li>
            <li><a href="#/completed">完了済み</a></li>
          </ul>
        </nav>
        <button id="clear-completed" type="button" class="link-button" hidden>完了済みを削除</button>
      </footer>
    </div>

    <p class="hint">タスク名をダブルクリックしても編集できます。データはこのブラウザに保存されます。</p>
  </main>

  <div class="toast-region" role="status" aria-live="polite">
    <div id="toast" class="toast" hidden>
      <span id="toast-message"></span>
      <button id="toast-undo" type="button">元に戻す</button>
    </div>
  </div>
</body>
</html>
